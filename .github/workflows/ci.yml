name: PrimeRides CI / CD Quality Gate

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: "ci_pipeline_synthetic_jwt_secret_key_2026_minimum_32_chars"
      DATABASE_URL: "mysql://ci_user:ci_pass@localhost:3306/primerides_db"
      RAZORPAY_KEY_ID: "rzp_test_placeholder"
      RAZORPAY_KEY_SECRET: "ci_test_razorpay_secret_key_12345"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Verification (Web & Mobile)
        run: npm run check:all

      - name: Run Unit & Integration Test Suites
        run: npm test

      - name: Next.js Production Build Validation
        run: npm run build
